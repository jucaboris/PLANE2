<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sky Authority</title>
  <style>
    :root { --bg:#050705; --panel:#0d1b0d; --line:#39ff14; --txt:#e8ffe8; --warn:#ffb000; --bad:#ff3c3c; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
    .screen{display:none;min-height:100vh;padding:16px}
    .screen.active{display:flex;flex-direction:column;gap:12px}
    .card{background:var(--panel);border:1px solid #1f4d1f;border-radius:10px;padding:12px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .grid{display:grid;gap:10px}
    .grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .btn{border:1px solid #2e7c2e;background:#173117;color:var(--txt);padding:10px 12px;border-radius:8px;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.active{outline:2px solid var(--line)}
    .pill{padding:4px 10px;border:1px solid #3f6f3f;border-radius:999px}
    .action-list{display:grid;grid-template-columns:1fr;gap:8px}
    .log{height:220px;overflow:auto;border:1px solid #2a4b2a;padding:8px;background:#071007}
    .ok{color:#93ff93}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .portrait{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid #2f6f2f}
    #roleChoice .btn{min-width:140px}
    .section-label{display:block;font-size:12px;opacity:.8;margin:8px 0 4px}
    .popup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
    .popup.active{display:flex}
    .popup-card{background:#102010;border:1px solid #3a7a3a;border-radius:12px;max-width:560px;width:100%;padding:18px}
    @media(min-width:1024px){.master-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}}
  </style>
</head>
<body>
  <div id="bootScreen" class="screen active">
    <div class="card">
      <h2>Sky Authority</h2>
      <p id="loadingStatus">Carregando...</p>
      <button id="startExperienceBtn" class="btn" disabled>Iniciar</button>
    </div>
  </div>

  <div id="gameScreen" class="screen">
    <div class="row">
      <span class="pill">Modo: <b id="modeBadge">G1</b></span>
      <span class="pill">Fase: <b id="phase">IDLE</b></span>
      <span class="pill">Rodada: <b id="round">1</b></span>
      <span class="pill">Tempo: <b id="timer">120</b>s</span>
    </div>

    <div class="master-layout">
      <div class="grid">
        <div class="card">
          <h4 id="cockpitTitle">Cockpit</h4>
          <div class="row">
            <img id="myRoleImage" class="portrait" src="terminal-pilot.png" alt="personagem" />
            <div>
              <div id="myRoleLabel">Comando</div>
              <small id="modeHint"></small>
            </div>
          </div>

          <label class="section-label" id="characterChoiceLabel">Personagem</label>
          <div class="grid grid-2" id="roleChoice"></div>
          <label class="section-label" id="actionChoiceLabel">Ação</label>
          <div class="action-list" id="actionButtons"></div>
          <button id="submitBtn" class="btn">Votar</button>

          <div id="masterCockpitControls" class="card" style="display:none;margin-top:10px">
            <h4>Execução do Mestre</h4>
            <div>
              <label>Responsabilidade:</label>
              <div class="grid grid-2" id="masterRespButtons"></div>
            </div>
            <div style="margin-top:8px">
              <label>Ação para executar:</label>
              <div class="action-list" id="masterActionButtons"></div>
            </div>
            <button id="masterExecuteBtn" class="btn">Executar responsabilidade</button>
            <div class="row" style="margin-top:8px">
              <button id="masterEndTimeBtn" class="btn">Encerrar tempo agora</button>
              <button id="masterNextModeBtn" class="btn">Próximo modo</button>
            </div>
          </div>

          <div class="row" style="margin-top:10px">
            <button id="startBtn" class="btn">Iniciar rodada</button>
            <button id="resetBtn" class="btn">Resetar modo</button>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h4>Painel do Mestre (votos ao vivo)</h4>
          <div id="masterVotes"></div>
        </div>

        <div class="card">
          <h4>Log</h4>
          <div id="log" class="log"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusPopup" class="popup">
    <div class="popup-card">
      <h3 id="popupTitle">Aviso</h3>
      <p id="popupMessage"></p>
      <button id="popupCloseBtn" class="btn">Entendi</button>
    </div>
  </div>

  <script type="module" src="./ui.js"></script>
</body>
</html>
